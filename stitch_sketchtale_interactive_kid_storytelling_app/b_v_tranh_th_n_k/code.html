<script>
  (function() {
    const tabDraw = document.getElementById('tab-draw');
    const tabCamera = document.getElementById('tab-camera');
    const cameraGuide = document.getElementById('camera-frame-guide');
    const canvasImg = document.getElementById('main-canvas-img');
    const magicBtn = document.getElementById('magic-transform-btn');

    // Tab Switcher Behavior
    if (tabDraw && tabCamera) {
      tabDraw.addEventListener('click', () => {
        tabDraw.classList.add('bg-surface-container-lowest', 'text-primary', 'shadow-[0_4px_0_#d6c4ac]');
        tabDraw.classList.remove('text-on-surface-variant');
        tabCamera.classList.remove('bg-surface-container-lowest', 'text-primary', 'shadow-[0_4px_0_#d6c4ac]');
        tabCamera.classList.add('text-on-surface-variant');
        if (cameraGuide) cameraGuide.classList.add('hidden');
        if (canvasImg) canvasImg.classList.remove('opacity-40');
      });

      tabCamera.addEventListener('click', () => {
        tabCamera.classList.add('bg-surface-container-lowest', 'text-primary', 'shadow-[0_4px_0_#d6c4ac]');
        tabCamera.classList.remove('text-on-surface-variant');
        tabDraw.classList.remove('bg-surface-container-lowest', 'text-primary', 'shadow-[0_4px_0_#d6c4ac]');
        tabDraw.classList.add('text-on-surface-variant');
        if (cameraGuide) cameraGuide.classList.remove('hidden');
        if (canvasImg) canvasImg.classList.add('opacity-40');
      });
    }

    // Color Selector Micro-interaction
    const colorBtns = document.querySelectorAll('.color-btn');
    colorBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        colorBtns.forEach(b => {
          const checkIcon = b.querySelector('.material-symbols-outlined');
          if (checkIcon) checkIcon.classList.add('opacity-0');
        });
        const activeIcon = btn.querySelector('.material-symbols-outlined');
        if (activeIcon) activeIcon.classList.remove('opacity-0');
      });
    });

    // Brush Sizes Switcher
    const brushBtns = document.querySelectorAll('.brush-size-btn');
    brushBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        brushBtns.forEach(b => {
          b.classList.remove('bg-surface-container-lowest', 'text-primary', 'shadow-[0_2px_0_#d6c4ac]');
          b.classList.add('bg-surface-container', 'text-on-surface-variant');
        });
        btn.classList.add('bg-surface-container-lowest', 'text-primary', 'shadow-[0_2px_0_#d6c4ac]');
        btn.classList.remove('bg-surface-container', 'text-on-surface-variant');
      });
    });

    // Magic Button Delight Shake & Feedback
    if (magicBtn) {
      magicBtn.addEventListener('click', () => {
        canvasImg.classList.add('scale-105', 'rotate-2');
        setTimeout(() => {
          canvasImg.classList.remove('scale-105', 'rotate-2');
        }, 600);
      });
    }
  })();
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface/85 backdrop-blur-xl shadow-[0_-4px_20px_rgba(74,53,20,0.06)]" data-active-classes="text-secondary"><div class="flex justify-around items-center h-20 px-margin-page relative"><a class="flex flex-col items-center justify-center min-w-[56px] min-h-[56px] text-on-surface-variant transition-transform active:scale-95" data-path="thu-vien-truyen" href="#"><span class="material-symbols-outlined text-[28px]">auto_stories</span><span class="font-label-sm text-label-sm mt-1">Thư viện truyện</span></a><a class="flex flex-col items-center justify-center -mt-6 min-w-[64px] min-h-[64px] rounded-full bg-primary-container text-on-primary-container shadow-[0_6px_0_#d99800] active:translate-y-1 active:shadow-none transition-all" data-path="be-ve-tranh" href="#"><span class="material-symbols-outlined text-[32px]">palette</span><span class="font-label-sm text-label-sm font-bold">Bé vẽ</span></a><a class="flex flex-col items-center justify-center min-w-[56px] min-h-[56px] text-on-surface-variant transition-transform active:scale-95" data-path="bo-suu-tap" href="#"><span class="material-symbols-outlined text-[28px]">stars</span><span class="font-label-sm text-label-sm mt-1">Bộ sưu tập</span></a></div></nav></body></html>
